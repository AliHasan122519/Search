<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="المساعد الذكي في علم التعبير والفراسة، مع كتب التعبير ونظمه وكتب الفراسة وقواعد التعبير." />
  <meta name="theme-color" content="#041412" />
  <script>
    /* applies the saved theme (or the system preference) before the first paint, so the page never flashes the wrong colours */
    (function () { var t = null; try { t = localStorage.getItem('qs-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'dark' ? '#041412' : '#f6efdc'); })();
  </script>
  <title>المكتبة الشاملة</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preload" href="./assets/Dubai-Bold.ttf" as="font" type="font/ttf" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
