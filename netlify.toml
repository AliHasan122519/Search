# سلسلة النشر الآلي للموقع: كل رفع إلى main يغيّر الواجهة أو المحتوى أو نموذج الفهم يُبنى وينشر وحده على Netlify
# (يكفي ربط الموقع بهذا المستودع مرة واحدة: Netlify › Site configuration › Build & deploy › Link repository).
[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"
  # لا يُعاد البناء إذا لم يتغير شيء يخص الموقع (مثلًا نشر ملف APK فقط): يوفّر رصيد الحساب
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public content ':(exclude)content/manifest.json' data index.html vite.config.ts package.json netlify.toml"

[build.environment]
  NODE_VERSION = "20"

# ملفات النموذج والبيانات كبيرة: يحتفظ بها المتصفح (فهرس الصفحة وفهرس المحتوى يُفحصان دائمًا)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/ai/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
[[headers]]
  for = "/content/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
